services:
  frontend-dev:
    container_name: frontend
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    expose:
      - 80

  frontend-prod:
    container_name: frontend
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - 80
